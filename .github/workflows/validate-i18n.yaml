name: Validate translations

on:
  push:
    paths:
      - "translations/**"
  pull_request:
    paths:
      - "translations/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-translations:
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Translations well-formed + template structure (JSON only, no JS sync required)
        run: npm run i18n:validate:structure
