name: Docs site

# The site documents the latest stable release: a pre-release never publishes.
# Run it by hand from a release tag ("Use workflow from"), never from main.
on:
  release:
    types: [released]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/docs/requirements.txt
      - run: pip install -r scripts/docs/requirements.txt
      - run: mkdocs build
      # Read by the README's shields.io endpoint badge: the version actually deployed.
      - run: >-
          printf '{"schemaVersion":1,"label":"Documentation","message":"%s","color":"blue","namedLogo":"materialformkdocs"}'
          "$REF" > site/badge.json
        env:
          REF: ${{ github.ref_name }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
