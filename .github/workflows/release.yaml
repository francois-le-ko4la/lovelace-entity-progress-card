name: Release Processing
on:
  release:
    types: [published]
jobs:
  build-and-upload:
    name: Minify JS & Upload Assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the preflight below resolves origin/main to prove the
          # tag sits on it, which a shallow checkout makes impossible.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      # The three things a push cannot check, because no tag exists yet. First,
      # so an incoherent tag fails in seconds instead of after the full gate.
      - name: Release preflight (tag ↔ VERSION ↔ CHANGELOG ↔ main)
        run: node scripts/check-release-tag.js
      # check:github is check:push minus the dev bundle: that one carries
      # debug defaults and has no business on a release runner. Everything else
      # is identical - check:push just calls this and adds the dev build.
      - name: Full pre-release gate
        run: npm run check:github
      - name: Upload to Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          # Named, not a glob - the shipped bundle, explicitly.
          file: dist/entity-progress-card.js
          tag: ${{ github.event.release.tag_name }}
          overwrite: true
