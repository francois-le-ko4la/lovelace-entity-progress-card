site_name: Entity Progress Card
site_url: https://francois-le-ko4la.github.io/lovelace-entity-progress-card/
site_description: A Home Assistant Lovelace card showing an entity's progress as a bar.
repo_url: https://github.com/francois-le-ko4la/lovelace-entity-progress-card
repo_name: lovelace-entity-progress-card
edit_uri: edit/main/docs/

extra:
  # The home page is built from this file (this repository's README.md).
  readme: README.md

extra_css:
  - stylesheets/extra.css
  - https://unpkg.com/katex@0/dist/katex.min.css

extra_javascript:
  - assets/katex.js
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js

hooks:
  - scripts/docs/hooks.py

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - toc.follow
    - toc.integrate
    - content.code.copy
    - navigation.instant
    - header.autohide
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode

nav:
  - Home: index.md
  - Configuration: configuration.md
  - Cookbook: cookbook.md
  - Theme Guide: theme.md
  - Troubleshooting: troubleshooting.md
  - Testing an RC: rc-testing.md
  - Contributing: contributing.md
  - Changelog: changelog.md

not_in_nav: |
  code_of_conduct.md
  development.md
  option-map.md

markdown_extensions:
  - github-callouts
  # GitHub nests list items at 2 spaces, Python-Markdown at 4.
  - mdx_truly_sane_lists:
      nested_indent: 2
      truly_sane: false
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      # GitHub's anchors (an emoji heading keeps its leading "-"), so the
      # links written for github.com resolve here too.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
