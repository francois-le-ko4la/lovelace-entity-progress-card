version = 1

# Build tooling (esbuild pipeline, CSS inliner, release-flag guard). These
# scripts legitimately use console.* for their output and run under Node only -
# excluded from analysis so their intentional patterns don't surface as issues.
exclude_patterns = [
  "scripts/**",
]

# Assertion helpers legitimately do things flagged as issues in application
# code (an explicit `undefined` expectation, re-assigning to observe the
# setter). Declaring them lets DeepSource skip those checks here.
test_patterns = [
  "test/**",
]

[[analyzers]]
name = "javascript"

  [analyzers.meta]
  environment = [
    "browser",
    "nodejs"
  ]