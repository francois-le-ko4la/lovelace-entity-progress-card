views:
  - title: EP Demo - Standard, unit & decimal
    icon: mdi:flask-outline
    path: epb-standard
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Card, Badge, Template & Feature — the standard set
            heading_style: title
          - type: markdown
            content: |
              {% raw %}
              ```yaml
              type: custom:entity-progress-card
              entity: input_number.epb_demo_battery
              name: entity-progress-card
              ```
              The same entity, shown through the three basic building blocks:
              the standalone **card**, a Tile **feature** (bare bar, no
              frame - HA's own tile already provides one), and the
              Jinja-driven **template** variant (icon/name/percent all
              resolved from templates instead of reading the entity
              directly, so it works without a bound `entity` at all).
              {% endraw %}
            grid_options:
              columns: 12
              rows: 2
          - type: custom:entity-progress-card
            entity: input_number.epb_demo_battery
            name: entity-progress-card
            grid_options:
              columns: 6
              rows: 1
          - type: tile
            entity: input_number.epb_demo_battery
            name: entity-progress-feature (Tile)
            features:
              - type: custom:entity-progress-feature
                entity: input_number.epb_demo_battery
            grid_options:
              columns: 6
              rows: 2
          - type: custom:entity-progress-card-template
            entity: input_number.epb_demo_battery
            name: entity-progress-card-template
            secondary: '{{ states(entity) }}%'
            percent: '{{ states(entity) }}'
            grid_options:
              columns: 6
              rows: 1
        column_span: 1
      - type: grid
        cards:
          - type: heading
            heading: From the original demo — bar_stack & center_zero
            heading_style: title
          - type: custom:entity-progress-card
            entity: input_number.epb_demo_battery
            name: Glass & radius
            bar_effect:
              - radius
              - glass
          - type: custom:entity-progress-card
            entity: input_number.epb_demo_battery
            name: Bar stack (charged + reserved)
            bar_stack:
              entities:
                - entity: input_number.epb_demo_battery_reserved
                  color: orange
          - type: custom:entity-progress-card
            entity: input_number.epb_demo_power
            name: Center zero (grid power)
            center_zero: true
            min_value: -3000
            max_value: 3000
          - type: custom:entity-progress-card
            entity: input_number.epb_demo_grid_consumption
            name: Net balance (consumption − production)
            center_zero: true
            min_value: -3000
            max_value: 3000
            bar_stack:
              mode: net
              entities:
                - entity: input_number.epb_demo_solar_production
                  subtract: true
          - type: custom:entity-progress-card
            entity: input_number.epb_demo_solar_production
            name: 'Energy: production (+) vs consumption (−)'
            center_zero: true
            min_value: -3000
            max_value: 3000
            bar_stack:
              entities:
                - entity: input_number.epb_demo_grid_consumption
                  subtract: true
                  color: red
          - type: custom:entity-progress-card
            entity: timer.epb_demo_timer
            name: Timer (start it!)
            tap_action:
              action: call-service
              service: timer.start
              target:
                entity_id: timer.epb_demo_timer
      - type: grid
        cards:
          - type: heading
            heading: unit — with/without, with/without space
            heading_style: title
          - type: markdown
            content: |
              {% raw %}
              ```yaml
              type: custom:entity-progress-card
              entity: input_number.epb_demo_temperature
              unit: kW              # override the entity's own unit_of_measurement
              unit_spacing: space   # auto | space | no-space
              hide: [unit]          # or drop the unit entirely
              ```
              What varies below: the default (native unit, spaced), an
              overridden unit, `no-space`/`space` spacing, hiding the unit
              via `hide`, and an empty `unit: ""` (blank text, no space
              either).
              {% endraw %}
            grid_options:
              columns: 12
              rows: 2
          - type: custom:entity-progress-card
            entity: input_number.epb_demo_temperature
            name: Default (native unit, spaced)
          - type: custom:entity-progress-card
            entity: input_number.epb_demo_temperature
            name: 'unit: kW (override)'
            unit: kW
          - type: custom:entity-progress-card
            entity: input_number.epb_demo_temperature
            name: 'hide: [unit]'
            hide:
              - unit
          - type: custom:entity-progress-card
            entity: input_number.epb_demo_temperature
            name: 'unit_spacing: no-space'
            unit_spacing: no-space
          - type: custom:entity-progress-card
            entity: input_number.epb_demo_temperature
            name: 'unit_spacing: space'
            unit: '%'
            unit_spacing: space
          - type: custom:entity-progress-card
            entity: input_number.epb_demo_temperature
            name: "unit: '' (blank, no space either)"
            unit: ''
      - type: grid
        cards:
          - type: heading
            heading: decimal — automatic, 1, 2, 3
            heading_style: title
          - type: markdown
            content: |
              {% raw %}
              ```yaml
              type: custom:entity-progress-card
              entity: input_number.epb_demo_temperature
              unit: °C
              decimal: 1   # left unset: derived automatically from the entity
              ```
              `decimal` controls how many digits the displayed value shows -
              left unset it's derived automatically (from the entity's own
              precision, or a sensible per-type default).
              {% endraw %}
            grid_options:
              columns: 12
              rows: 2
          - type: custom:entity-progress-card
            entity: input_number.epb_demo_temperature
            name: decimal unset (automatic)
            unit: °C
          - type: custom:entity-progress-card
            entity: input_number.epb_demo_temperature
            name: 'decimal: 1'
            unit: °C
            decimal: 1
          - type: custom:entity-progress-card
            entity: input_number.epb_demo_temperature
            name: 'decimal: 2'
            unit: °C
            decimal: 2
          - type: custom:entity-progress-card
            entity: input_number.epb_demo_temperature
            name: 'decimal: 3'
            unit: °C
            decimal: 3
      - type: grid
        cards:
          - type: heading
            heading: Content & text
            heading_style: title
          - type: markdown
            content: |
              {% raw %}
              ```yaml
              type: custom:entity-progress-card
              entity: input_number.epb_demo_battery
              hide: [icon, unit]   # any of: icon, name, unit, secondary_info, value
              state_content: [state, last_changed]
              multiline: true
              custom_info: "Feels like {{ states(entity) | float - 2 }} °C"
              name_info: "{% if states(entity) | float < 20 %}⚠️ low{% endif %}"
              reverse_secondary_info_row: true
              ```
              What varies below: hiding individual parts (`hide`), swapping
              what `secondary_info` shows (`state_content`), a second line
              (`multiline` + `custom_info`), a small aside next to the name
              (`name_info`), flipping the secondary-info row's order, and
              text placed directly over the bar (`bar_position: background`/
              `overlay` + `text_shadow`/`bar_single_line`).
              {% endraw %}
            grid_options:
              columns: 12
              rows: 2
          - type: custom:entity-progress-card
            entity: input_number.epb_demo_battery
            name: 'hide: [icon, unit]'
            hide:
              - icon
              - unit
          - type: custom:entity-progress-card
            entity: input_number.epb_demo_battery
            name: 'hide: [name, secondary_info] (bar + icon only)'
            hide:
              - name
              - secondary_info
          - type: custom:entity-progress-card
            entity: input_number.epb_demo_battery
            name: 'state_content: [state, last_changed]'
            state_content:
              - state
              - last_changed
          - type: custom:entity-progress-card
            entity: input_number.epb_demo_battery
            name: reverse_secondary_info_row
            reverse_secondary_info_row: true
          - type: custom:entity-progress-card
            entity: input_number.epb_demo_temperature
            name: multiline (custom_info on its own line)
            multiline: true
            custom_info: Feels like {{ states(entity) | float - 2 }} °C
          - type: custom:entity-progress-card
            entity: input_number.epb_demo_battery
            name: name_info (Jinja, next to the name)
            name_info: '{% if states(entity) | float < 20 %}⚠️ low{% endif %}'
          - type: custom:entity-progress-card
            entity: input_number.epb_demo_battery
            name: 'bar_position: background + text_shadow'
            bar_position: background
            text_shadow: true
            color: white
          - type: custom:entity-progress-card
            entity: input_number.epb_demo_battery
            name: 'bar_position: overlay + bar_single_line'
            bar_position: overlay
            bar_single_line: true
            bar_size: large
      - type: grid
        cards:
          - type: heading
            heading: More data sources
            heading_style: title
          - type: markdown
            content: |
              {% raw %}
              ```yaml
              type: custom:entity-progress-card
              entity: sun.sun
              attribute: elevation   # read an attribute instead of the state
              max_value:
                entity: input_number.epb_demo_battery_reserved   # ...or another entity
              min_value:
                jinja: "{{ 5 }}"                                 # ...or a Jinja template
              ```
              `entity`/`attribute`/`min_value`/`max_value` don't have to be a
              plain number or the bare state - an attribute on the same
              entity, another entity's own state, or a Jinja template all
              work the same way.
              {% endraw %}
            grid_options:
              columns: 12
              rows: 2
          - type: custom:entity-progress-card
            entity: sun.sun
            attribute: elevation
            name: attribute (sun.sun's own elevation, no helper needed)
            min_value: -90
            max_value: 90
            center_zero: true
          - type: custom:entity-progress-card
            entity: input_number.epb_demo_battery
            name: 'max_value: {entity} (dynamic, from another entity)'
            max_value:
              entity: input_number.epb_demo_battery_reserved
          - type: custom:entity-progress-card
            entity: input_number.epb_demo_battery
            name: 'min_value: {jinja}'
            min_value:
              jinja: '{{ 5 }}'
          - type: custom:entity-progress-card
            entity: input_number.epb_demo_battery
            name: 'reverse: true (fills from the other end)'
            reverse: true
          - type: custom:entity-progress-card
            entity: input_number.epb_demo_grid_consumption
            name: 'bar_stack mode: proportional'
            center_zero: true
            min_value: -3000
            max_value: 3000
            bar_stack:
              mode: proportional
              entities:
                - entity: input_number.epb_demo_solar_production
                  subtract: true
                  color: green
      - type: grid
        cards:
          - type: heading
            heading: Templates — icon/color/bar_color in Jinja, fast_refresh
            heading_style: title
          - type: markdown
            content: |
              {% raw %}
              ```yaml
              type: custom:entity-progress-card-template
              entity: input_number.epb_demo_battery
              percent: "{{ states(entity) }}"
              icon: "{% if states(entity) | float > 20 %}mdi:battery-alert{% else %}mdi:battery{% endif %}"
              color: "{% if states(entity) | float < 20 %}red{% else %}green{% endif %}"
              fast_refresh: true   # force a render every tick (countdowns)
              ```
              The **template** card resolves `icon`/`color`/`bar_color`/
              `percent` from Jinja instead of reading the entity directly.
              `fast_refresh: true` keeps a ticking countdown accurate every
              second - HA only pushes a fresh template render once a minute
              on its own otherwise.
              {% endraw %}
            grid_options:
              columns: 12
              rows: 2
          - type: custom:entity-progress-card-template
            entity: input_number.epb_demo_battery
            name: icon (Jinja)
            percent: '{{ states(entity) }}'
            icon: >-
              {% if states(entity) | float > 20 %}mdi:battery-alert {% else
              %}mdi:battery{% endif %}
          - type: custom:entity-progress-card-template
            entity: input_number.epb_demo_battery
            name: color (Jinja)
            percent: '{{ states(entity) }}'
            color: '{% if states(entity) | float < 20 %}red{% else %}green{% endif %}'
          - type: custom:entity-progress-card-template
            entity: input_number.epb_demo_battery
            name: bar_color (Jinja)
            percent: '{{ states(entity) }}'
            bar_color: '{% if states(entity) | float < 20 %}red{% else %}green{% endif %}'
          - type: custom:entity-progress-card-template
            entity: timer.epb_demo_timer
            name: 'fast_refresh: true — real ticking MM:SS (start the timer!)'
            fast_refresh: true
            secondary: >-
              {% set remaining = as_datetime(state_attr(entity, 'finishes_at'))
              - now() %} {{ '%02d:%02d' % (remaining.seconds // 60,
              remaining.seconds % 60) }}
            percent: >-
              {% set remaining = as_datetime(state_attr(entity, 'finishes_at'))
              - now() %} {# helper's own duration is fixed at 5 minutes (300s) -
              see the timer.epb_demo_timer helper at the top of this file #} {{
              (remaining.total_seconds() / 300 * 100) | round(1) }}
            tap_action:
              action: call-service
              service: timer.start
              target:
                entity_id: timer.epb_demo_timer
      - type: grid
        cards:
          - type: heading
            heading: Actions & badge min_width
            heading_style: title
          - type: markdown
            content: |
              {% raw %}
              ```yaml
              type: custom:entity-progress-card
              entity: input_number.epb_demo_battery
              tap_action:
                action: more-info
              hold_action:
                action: none
              double_tap_action:
                action: toggle
              icon_tap_action:        # the icon can have its own, separate actions
                action: navigate
                navigation_path: /config/helpers
              ```
              `tap_action`/`hold_action`/`double_tap_action` on the card
              itself, and a fully separate set on just the icon
              (`icon_tap_action`/`icon_hold_action`/`icon_double_tap_action`)
              - plus `name` as a composed list of tokens instead of a plain
              string.
              {% endraw %}
            grid_options:
              columns: 12
              rows: 2
          - type: custom:entity-progress-card
            entity: input_number.epb_demo_battery
            name: 'tap: more-info / hold: none / double: toggle'
            tap_action:
              action: more-info
            hold_action:
              action: none
            double_tap_action:
              action: toggle
          - type: custom:entity-progress-card
            entity: input_number.epb_demo_battery
            name: 'icon_tap_action: navigate'
            icon_tap_action:
              action: navigate
              navigation_path: /config/helpers
          - type: custom:entity-progress-card
            entity: input_number.epb_demo_battery
            name: icon_hold_action / icon_double_tap_action
            icon_hold_action:
              action: more-info
            icon_double_tap_action:
              action: toggle
          - type: custom:entity-progress-card
            entity: input_number.epb_demo_battery
            name:
              - type: text
                text: 'name: composition — '
              - type: entity
      - type: grid
        cards:
          - type: heading
            heading: Ellipsis
            heading_style: title
          - type: custom:entity-progress-card
            entity: input_number.epb_demo_battery
            lv: zkejf
            decimal: 1
            layout: horizontal
            bar_size: xlarge
            unit: >-
              iuuiouioiiouuoiuiouiouoiukljjh jklshsdjhjsd sjkdhf sdjfh sdkjfh
              skjdfhkj tjhertg ejrg ekrgjhjerghkj
            name: >-
              jhhkhjhkjhkjhkjhkhjkhergjhekrjh erjgh ejr kjgehr gkjher gjer
              gjkher. erjghekrhgjehrkgjkergh
            grid_options:
              columns: 6
              rows: 2
          - type: custom:entity-progress-card
            entity: input_number.epb_demo_battery
            lv: zkejf
            decimal: 1
