              Features, reference only)
            heading_style: title
          - type: markdown
            content: |
              {% raw %}
              Not runnable here (brand-specific integrations) - three
              verified approaches depending on what your washer's
              integration actually exposes.

              **Home Connect (Bosch/Siemens)** - direct, no extra config:
              ```yaml
              type: custom:entity-progress-card
              entity: sensor.washing_machine_program_progress
              name: Washing Machine
              ```

              **Miele** - Jinja `max_value`, no helper needed:
              ```yaml
              type: custom:entity-progress-card
              entity: sensor.washing_machine_elapsed_time
              unit: '%'
              max_value:
                jinja: >
                  {{ (states('sensor.washing_machine_elapsed_time') | float(0))
                     + (states('sensor.washing_machine_remaining_time') | float(0)) }}
              ```

              **Samsung (SmartThings)** - only `machine_state`/`job_state`/
              `completion_time`, no elapsed/remaining time: needs an
              `input_datetime` helper + automation to anchor a start time
              first, then the same technique as the next card below. Full
              write-up: [README - Washing Machine Progress](https://github.com/francois-le-ko4la/lovelace-entity-progress-card#-usage).
              {% endraw %}
            grid_options:
              columns: 12
              rows: 4
      - type: grid
        cards:
          - type: heading
