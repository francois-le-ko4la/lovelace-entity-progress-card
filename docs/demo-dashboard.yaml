          #  - custom:mushroom-entity-card (default HACS): piitaya/lovelace-mushroom
          #  - card_mod (default HACS): thomasloven/lovelace-card-mod
          #  - stands in for a real Litter-Robot integration entity with the
          #    epb_demo_litter_* helpers from demo-dashboard-helpers.yaml -
          #    swap for your own sensor.litter_robot_* entities in a real setup.
          #
          # What it demonstrates: bar_position: compact_below (#123) on two
          # frameless/marginless bars sharing one visually combined card with a
          # Mushroom entity row - each bar's own bar_color Jinja recolors the
          # fill red past a threshold (litter level low / waste drawer full),
