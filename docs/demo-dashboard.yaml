              Features, reference only)
            heading_style: title
          - type: markdown
            content: |
              {% raw %}
              Not runnable here (needs a real print job's start/end time
              entities) - a Template helper (Number) computes the total
              duration from start/end timestamps, then feeds it straight into
              `max_value` as an entity reference:
              ```yaml
              type: custom:entity-progress-card
              entity: sensor.print_puppy_remaining_time
              max_value: number.totaldurationofthetask
              decimal: 0
              bar_color: green
              icon: mdi:clock-end
              ```
              Full write-up (helper template + math model): [README -
              Cracking a Complex
              Case](https://github.com/francois-le-ko4la/lovelace-entity-progress-card#-usage).
              {% endraw %}
            grid_options:
              columns: 12
              rows: 3
      - type: grid
        cards:
          - type: heading
