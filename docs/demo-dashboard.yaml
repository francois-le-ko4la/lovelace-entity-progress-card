                marginless: false
                bar_position: compact_below
                height: 40px
            stackMode: vertical-stack
            hideGap: true
            card_mod:
              style: |
                ha-card {
                  border: 1px solid var(--divider-color) !important;
                  padding-bottom: 6px;
