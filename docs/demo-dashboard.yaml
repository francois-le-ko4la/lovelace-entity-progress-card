                  max: 20
                  color: yellow
                - min: 20
                  max: 90
                  color: green
              unit: '%'
              state_content: state
              ```
              Full write-up: [README - Don't Let It
              Expire](https://github.com/francois-le-ko4la/lovelace-entity-progress-card#-usage).
              {% endraw %}
            grid_options:
              columns: 12
              rows: 4
