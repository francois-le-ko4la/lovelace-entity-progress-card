# =============================================================================
# Entity Progress Card — Demo dashboard helpers (packages format)
# =============================================================================
# Drop this file in your HA config folder (next to configuration.yaml, or in
# your packages folder) and reference it as a package - see the `!include`
# instructions at the top of demo-dashboard.yaml.
