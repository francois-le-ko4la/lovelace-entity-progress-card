# =============================================================================
# Entity Progress Card — Demo dashboard (-dev build variant)
# =============================================================================
# Same as demo-dashboard.yaml, but every `custom:entity-progress-*` card type
# targets its `-dev` resource instead (e.g. `entity-progress-card-dev`) - use
# this one when testing against a locally-built dev resource
# (CARD_CONTEXT.dev: true) rather than the production build. Regenerate after
# editing demo-dashboard.yaml rather than hand-editing this file.
#
# 1. Create the demo helpers - three options:
#    a. UI: Settings → Devices & services → Helpers → + Add helper, one by
#       one, using the values from the `# --- helpers ---` block below.
#    b. Paste the `# --- helpers ---` block (uncommented) directly under the
#       matching top-level keys in your configuration.yaml.
#    c. Packages: copy demo-dashboard-helpers.yaml next to your
#       configuration.yaml (or into your packages folder), then reference it:
#         homeassistant:
#           packages:
#             epb_demo: !include demo-dashboard-helpers.yaml
#       (needs `homeassistant: packages:` enabled - see the HA docs on
#       packages if you don't already use them). Reload input_number /
#       input_boolean / timer from Developer Tools → YAML, no restart needed.
# 2. Create a new dashboard (Settings → Dashboards → Add) in YAML mode and
#    paste the `views:` block, or add the cards one by one to any dashboard.
# 3. Move the input_number sliders to see the cards react.
#
# Every card below reuses the same handful of helpers (overriding unit,
# decimal, theme, layout... per card) rather than adding a new one per demo -
# the point is to show how much a single entity's *display* can be reshaped
# without touching the entity itself.
#
