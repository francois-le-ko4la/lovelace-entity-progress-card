          - type: tile
            grid_options:
              min_columns: 4
              columns: 6
              rows: 2
            entity: input_boolean.epb_demo_printer
            name: 'Multi-feature use case: printer ink levels'
            features:
              - type: custom:entity-progress-multi-feature-dev
                bar_size: xsmall
                entities:
                  - entity: input_number.epb_demo_printer_ink_black
                    bar_color: black
                  - entity: input_number.epb_demo_printer_ink_cyan
                    bar_color: cyan
                  - entity: input_number.epb_demo_printer_ink_magenta
                    bar_color: magenta
                  - entity: input_number.epb_demo_printer_ink_yellow
                    bar_color: yellow
          - type: heading
            heading: Sunset (#60 / @Duncan1106)
            heading_style: title
          - type: markdown
            content: |
              {% raw %}
              ```yaml
              type: custom:entity-progress-card-template-dev
              entity: sun.sun
              name: "{{ ... next rise/set time ... }}"
              percent: "{{ ... % elapsed of the current day/night ... }}"
              fast_refresh: true
              ```
              Real-world use case from issue #60 - `name`/`color`/
              `bar_color`/`secondary`/`percent` all computed from `sun.sun`
              plus its `sensor.sun_next_rising`/`sun_next_setting`, with
              `fast_refresh` keeping the countdown ticking every second.
              {% endraw %}
            grid_options:
              columns: 12
              rows: 2
          - type: custom:entity-progress-card-template-dev
            entity: sun.sun
            name: >
              {% set sunrise = as_datetime(states('sensor.sun_next_rising')) %}
              {% set sunset = as_datetime(states('sensor.sun_next_setting')) %}
              {% if sunrise and sunset %}
                {% if sunrise < sunset %}
                  Next Rise: {{ sunrise.timestamp() | timestamp_custom('%H:%M', true) }}
                {% else %}
                  Next Setting: {{ sunset.timestamp() | timestamp_custom('%H:%M', true) }}
                {% endif %}
              {% else %}
                Suninformation not available
              {% endif %}
            bar_color: |
              {% if states('sun.sun') == 'below_horizon' %}
                lightgray
              {% else %}
                orange
              {% endif %}
            color: |
              {% if states('sun.sun') == 'below_horizon' %}
                none
              {% else %}
                orange
              {% endif %}
            secondary: >
              {% set sunrise = as_datetime(states('sensor.sun_next_rising')) %}
              {% set sunset = as_datetime(states('sensor.sun_next_setting')) %}
              {% set now_time = now() %} {% if sunrise and sunset %}
                {% if sunrise < sunset %}
                  {% set next_event = sunrise %}
                  {% set last_event = sunrise - timedelta(days=1) %}
                {% else %}
                  {% set next_event = sunset %}
                  {% set last_event = sunset - timedelta(days=1) %}
                {% endif %}
                {% set delta = next_event - now_time %}
                {% set total_seconds = delta.total_seconds() %}
                {% if total_seconds > 1 %}
                  {% set days = (total_seconds // 86400) | int %}
                  {% set hours = (total_seconds % 86400) // 3600 %}
                  {% set minutes = (total_seconds % 3600) // 60 %}
                  {% set seconds = (total_seconds % 60) %}
                  in
                  {% if days > 0 %}
                    {{ days }}d
                  {% endif %}
                  {{ '%02d:%02d:%02d' | format(hours | int, minutes | int, seconds | int) }}
                {% else %}
                  now
                {% endif %}
              {% else %}
                --:--:--
              {% endif %}
            percent: >
              {% set sunrise = as_datetime(states('sensor.sun_next_rising')) %}
              {% set sunset = as_datetime(states('sensor.sun_next_setting')) %}
              {% set now_time = now() %} {% if sunrise and sunset %}
                {% if sunrise < sunset %}
                  {% set next_event = sunrise %}
                  {% set last_event = sunrise - timedelta(days=1) %}
                {% else %}
                  {% set next_event = sunset %}
                  {% set last_event = sunset - timedelta(days=1) %}
                {% endif %}
                {% set total = (next_event - last_event).total_seconds() %}
                {% set elapsed = (now_time - last_event).total_seconds() %}
                {% if total > 0 %}
                  {{ ((elapsed / total) * 100) | round(2) }}
                {% else %}
                  0
                {% endif %}
              {% else %}
                0
              {% endif %}
            tap_action:
              action: more-info
            fast_refresh: true
            grid_options:
              columns: 12
              rows: 1
          - type: heading
