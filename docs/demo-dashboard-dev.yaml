              theme: critical_when_low
              double_tap_action:
                action: call-service
                service: script.epb_demo_reset_maintenance
              hold_action:
                action: call-service
                service: script.epb_demo_set_maintenance_near_due
              ```
              Real-world maintenance countdown - double-tap resets the
