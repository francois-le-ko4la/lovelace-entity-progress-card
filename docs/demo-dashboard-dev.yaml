        show_name: false
        show_state: true
        show_icon: true
        entity: sensor.sun_next_noon
        name: Tile example
      - type: custom:entity-progress-badge-dev
        entity: input_number.epb_demo_battery
        name: entity-progress-badge
      - type: custom:entity-progress-badge-template-dev
        entity: input_number.epb_demo_battery
        name: entity-progress-badge-template
        secondary: "{{ states(entity) }}%"
        percent: "{{ states(entity) }}"
      - type: custom:entity-progress-badge-dev
